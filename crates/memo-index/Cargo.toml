[package]
name = "memo-index"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Document extraction, hybrid (BM25 + vector) index and search for memo-editor"

[dependencies]
memo-core = { path = "../memo-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true

rusqlite = { version = "0.41", features = ["bundled"] }
sqlite-vec = "0.1.6"
calamine = "0.37"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_7881", "thread_safe"] }
html2text = "0.17"
blake3 = "1"
walkdir = "2"
unicode-normalization = "0.1"
notify = { version = "8", default-features = false }
notify-debouncer-full = { version = "0.7", default-features = false }

[dev-dependencies]
tempfile = "3"
encoding_rs = "0.8"
