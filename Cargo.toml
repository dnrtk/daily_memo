[workspace]
resolver = "2"
members = ["crates/memo-core", "crates/memo-index", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
